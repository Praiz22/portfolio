<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praix Image Studio // Blackbox Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/dist/index.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

:root {
    --glow-color: rgba(0, 255, 170, 0.15);
    --matrix-green: #00ffaa;
    --border-dark: #18181b;
}

body{
    background: radial-gradient(circle at 50% 50%, #090e1a 0%, #020204 70%);
    color:#e4e4e7;
    padding:40px 20px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background 0.1s ease;
}

/* --- Antigravity Particle Background --- */
.antigravity-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.particle {
    position: absolute;
    bottom: -20px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 50%;
    animation: floatUp 12s infinite linear;
}

@keyframes floatUp {
    0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-105vh) translateX(50px) scale(0.5); opacity: 0; }
}

body.warp-speed .particle {
    animation-duration: 3s !important;
    background: rgba(0, 255, 170, 0.15) !important;
    box-shadow: 0 0 8px var(--matrix-green);
}

/* --- Main Framework Containers --- */
.container{
    max-width:1100px;
    margin:auto;
    background:rgba(9, 9, 11, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-dark);
    border-radius:12px;
    padding:35px;
    position: relative;
    z-index: 1;
    animation: panelPulse 6s infinite alternate ease-in-out;
}

@keyframes panelPulse {
    0% { box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-color: var(--border-dark); }
    100% { box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 20px var(--glow-color); border-color: #27272a; }
}

header{
    text-align:left;
    margin-bottom:35px;
    border-bottom:1px dashed #18181b;
    padding-bottom:25px;
}

header h1{
    font-family: 'JetBrains Mono', monospace;
    font-size:1.75rem;
    font-weight: 700;
    letter-spacing: -1px;
    color: #fff;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

header h1::after {
    content: '';
    width: 8px;
    height: 8px;
    background: var(--matrix-green);
    border-radius: 50%;
    display: inline-block;
    animation: indicatorPulse 1.5s infinite alternate;
}

@keyframes indicatorPulse {
    0% { transform: scale(0.8); opacity: 0.4; box-shadow: 0 0 0px transparent; }
    100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 8px var(--matrix-green); }
}

header p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color:#71717a;
    margin-top: 5px;
}

.dropzone{
    border: 1px dashed #27272a;
    padding: 50px 20px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    background: rgba(4, 4, 6, 0.7);
    color: #a1a1aa;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.dropzone:hover{
    border-color: var(--matrix-green);
    color: #fff;
    background: rgba(7, 9, 8, 0.9);
    box-shadow: 0 0 20px rgba(0, 255, 170, 0.1);
}

.controls{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

/* --- Liquid-Chrome Glass Parameters --- */
.card{
    background: linear-gradient(135deg, rgba(10, 10, 14, 0.7) 0%, rgba(4, 4, 6, 0.9) 100%);
    padding: 20px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.03);
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease;
}

.card:hover {
    border-color: rgba(0, 255, 170, 0.25);
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.02), transparent);
    transform: skewX(-25deg);
    transition: 0.75s;
}

.card:hover::before {
    left: 150%;
}

label{
    font-family: 'JetBrains Mono', monospace;
    font-size:0.75rem;
    font-weight: 600;
    color:#71717a;
    display:block;
    margin-bottom:12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

select, input[type="text"], input[type="range"]{
    width:100%;
    padding:12px;
    border-radius:6px;
    background:#09090b;
    color:#fff;
    border:1px solid #27272a;
    outline:none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    transition: all 0.2s;
}

select:focus, input[type="text"]:focus {
    border-color: #52525b;
}

.checkbox-container {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    margin-top: 5px;
}

.checkbox-container input {
    width: auto;
    accent-color: var(--matrix-green);
}

/* --- Range Control Dynamic Rails --- */
input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: #18181b;
    height: 6px;
    padding: 0;
    border: none;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 2px;
    cursor: pointer;
    margin-top: -4px;
}

input[type="range"]::-webkit-slider-thumb:hover {
    background: var(--matrix-green);
}

input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 2px;
}

/* --- Previews and Badges --- */
.preview-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:20px;
    margin-top:30px;
}

.preview-card{
    background:#040406;
    padding:16px;
    border-radius:8px;
    border:1px solid #18181b;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.preview-card img{
    width:100%;
    border-radius:4px;
    object-fit: contain;
    aspect-ratio: 4/3;
    background: #09090b;
    background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    border: 1px solid #18181b;
}

.stats{
    font-family: 'JetBrains Mono', monospace;
    font-size:0.75rem;
    color:#a1a1aa;
    line-height: 1.6;
}

.stats strong {
    color: #fff;
}

.meta-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 2px 6px;
    background: rgba(39, 39, 42, 0.4);
    border: 1px solid rgba(63, 63, 70, 0.4);
    color: #a1a1aa;
    border-radius: 3px;
    display: inline-block;
    margin-top: 6px;
    margin-right: 4px;
    text-transform: uppercase;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

button{
    padding:14px 24px;
    border:1px solid #fff;
    border-radius:6px;
    cursor:pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight:600;
    background:#fff;
    color:#000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
}

button:hover {
    background: var(--matrix-green);
    border-color: var(--matrix-green);
}

button:disabled {
    background: #18181b;
    border-color: #27272a;
    color: #52525b;
    cursor: not-allowed;
}

button.secondary{
    background:transparent;
    color:#fff;
    border: 1px solid #27272a;
}

button.secondary:hover {
    background: #18181b;
    border-color: #3f3f46;
}

.card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.preview-card button {
    width: 100%;
    padding: 10px;
    background: transparent;
    color: #e4e4e7;
    border: 1px solid #27272a;
    font-size: 0.75rem;
}

.preview-card button:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
}

/* --- Laser Scan Animation & Shimmers --- */
.spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    border-top-color: #000;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.skeleton-img {
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 4px;
    background: #09090b;
    position: relative;
    overflow: hidden;
    border: 1px solid #18181b;
}

.skeleton-img::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--matrix-green), transparent);
    box-shadow: 0 0 10px var(--matrix-green);
    animation: scanLine 2s infinite linear;
}

@keyframes scanLine {
    0% { top: 0%; }
    50% { top: 100%; }
    100% { top: 0%; }
}

.skeleton-text {
    height: 10px;
    background: linear-gradient(90deg, #09090b 25%, #18181b 50%, #09090b 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 2px;
    margin-bottom: 8px;
}

.ai-status-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--matrix-green);
    text-transform: uppercase;
    text-align: center;
    margin-top: 4px;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
</style>
</head>
<body>

<div class="antigravity-bg" id="bgParticles"></div>

<div class="container">

<header>
    <h1>Praix Image Studio // Blackbox</h1>
    <p>System status: Active // Core Engine v3.5 // On-Device Neural Vision Model Enabled</p>
</header>

<div class="dropzone" id="dropzone">
    [ INITIALIZE SOURCE ROUTINE: DRAG FILE OR CLICK TO MOUNT ]
    <input type="file" id="fileInput" multiple hidden accept="image/*">
</div>

<div class="controls">
    <div class="card">
        <label>Output Format</label>
        <select id="format" onchange="checkFormatDependency()">
            <option value="image/png">PNG (Supports Transparency)</option>
            <option value="image/webp">WEBP (Supports Transparency)</option>
            <option value="image/jpeg">JPG (No Background Alpha)</option>
            <option value="image/avif">AVIF</option>
        </select>
    </div>

    <div class="card">
        <label>Neural Isolation Pipeline</label>
        <select id="bgRemovalMode" onchange="checkFormatDependency()">
            <option value="preserve">Keep Original Background</option>
            <option value="remove">Remove Background (Alpha Cutout)</option>
        </select>
    </div>

    <div class="card">
        <label>Naming Template</label>
        <input type="text" id="nameTemplate" value="[name]_converted" placeholder="Use [name] token">
    </div>

    <div class="card">
        <label>Scale / Dimension</label>
        <input type="range" id="resize" min="10" max="100" value="100">
    </div>

    <div class="card">
        <label>Target Quality</label>
        <input type="range" id="quality" min="0.1" max="1" step="0.05" value="0.95">
    </div>

    <div class="card" style="display: flex; align-items: center;">
        <label class="checkbox-container">
            <input type="checkbox" id="stripMetadata" checked>
            Strip Metadata (EXIF)
        </label>
    </div>
</div>

<div class="buttons">
    <button id="convertBtn" onclick="processImages()">Run Pipeline</button>
    <button class="secondary" onclick="downloadZip()">Export Package (.ZIP)</button>
</div>

<div class="preview-grid" id="previewGrid"></div>

</div>

<script>
// Ambient Radial Mouse Position Spotlight Tracker
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    document.body.style.background = `radial-gradient(circle at ${x}% ${y}%, #091124 0%, #020204 65%)`;
});

// Real-time Range Track Fill Calculator
function updateSliderTracks() {
    document.querySelectorAll('input[type="range"]').forEach(input => {
        const min = input.min || 0;
        const max = input.max || 100;
        const val = input.value;
        const percentage = ((val - min) / (max - min)) * 100;
        input.style.background = `linear-gradient(to right, var(--matrix-green) ${percentage}%, #18181b ${percentage}%)`;
    });
}
document.querySelectorAll('input[type="range"]').forEach(input => {
    input.addEventListener('input', updateSliderTracks);
});
updateSliderTracks();

function checkFormatDependency() {
    const bgRemovalMode = document.getElementById('bgRemovalMode').value;
    const formatSelect = document.getElementById('format');
    
    if (bgRemovalMode === 'remove' && formatSelect.value === 'image/jpeg') {
        formatSelect.value = 'image/png';
    }
}

// Generate Antigravity Particle Starfield
const bgParticles = document.getElementById('bgParticles');
const particleCount = 45;
for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.width = `${Math.random() * 4 + 2}px`;
    particle.style.height = particle.style.width;
    particle.style.animationDelay = `${Math.random() * 12}s`;
    particle.style.animationDuration = `${Math.random() * 8 + 8}s`;
    bgParticles.appendChild(particle);
}

let files = [];
let results = [];

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const previewGrid = document.getElementById('previewGrid');
const convertBtn = document.getElementById('convertBtn');

const extensionMap = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/avif': 'avif' };

dropzone.onmouseenter = () => document.body.classList.add('warp-speed');
dropzone.onmouseleave = () => document.body.classList.remove('warp-speed');

dropzone.onclick = () => fileInput.click();
fileInput.onchange = e => { files = [...e.target.files]; results = []; showPreviews(); };

dropzone.ondragover = e => { e.preventDefault(); document.body.classList.add('warp-speed'); dropzone.style.borderColor = "#00ffaa"; };
dropzone.ondragleave = () => { document.body.classList.remove('warp-speed'); dropzone.style.borderColor = "#27272a"; };
dropzone.ondrop = e => { e.preventDefault(); document.body.classList.remove('warp-speed'); files = [...e.dataTransfer.files]; results = []; showPreviews(); };

function showPreviews(){
    previewGrid.innerHTML = "";
    if (files.length === 0) return;
    files.forEach((file, index)=>{
        const reader = new FileReader();
        reader.onload = e=>{
            const div = document.createElement('div');
            div.className = "preview-card";
            div.id = `card-${index}`;
            
            const typeString = file.type.split('/')[1] || 'Unknown';

            div.innerHTML = `
                <img src="${e.target.result}">
                <div class="stats">
                    <strong>SRC:</strong> ${file.name}<br>
                    <strong>SIZE:</strong> ${(file.size/1024).toFixed(1)} KB<br>
                    <span class="meta-tag">${typeString}</span>
                    <span class="meta-tag">Source Asset</span>
                </div>
            `;
            previewGrid.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}

async function processImages(){
    if(files.length === 0) return alert("Queue empty. Load source files.");
    results = [];
    let processedCount = 0;
    const totalFiles = files.length;
    
    let format = document.getElementById('format').value;
    let quality = parseFloat(document.getElementById('quality').value);
    let scaleVal = parseInt(document.getElementById('resize').value);
    let bgRemovalMode = document.getElementById('bgRemovalMode').value;
    let template = document.getElementById('nameTemplate').value || "[name]";
    let stripMeta = document.getElementById('stripMetadata').checked;

    convertBtn.disabled = true;
    convertBtn.innerHTML = `<div class="spinner"></div> Init AI Neural Engine...`;

    files.forEach((file, index) => {
        const card = document.getElementById(`card-${index}`);
        if(card) {
            card.innerHTML = `
                <div class="skeleton-img"></div>
                <div style="padding-top:4px;">
                    <div class="skeleton-text" style="width:75%;"></div>
                    <div class="skeleton-text" style="width:45%;"></div>
                    <div class="ai-status-text" id="status-text-${index}">Booting Neural Vision Grid...</div>
                </div>`;
        }
    });

    const processingPromises = files.map((file, index) => {
        return new Promise(async (resolve) => {
            try {
                let activeSourceEffect = file;
                const statusLabel = document.getElementById(`status-text-${index}`);

                if (bgRemovalMode === 'remove') {
                    if (statusLabel) statusLabel.innerText = "Extracting Alpha Layer...";
                    
                    // Fallback proof explicit namespace calling
                    if (typeof imgly === 'undefined' || !imgly.backgroundRemoval) {
                        throw new Error("Library namespace initialization failed. Server context mandatory.");
                    }

                    const isolatedBlob = await imgly.backgroundRemoval(file, {
                        progress: (step, current, total) => {
                            if (statusLabel) {
                                const percentage = Math.round((current / total) * 100) || 0;
                                statusLabel.innerText = `${step.replace(/([A-Z])/g, ' $1')}: ${percentage}%`;
                            }
                        }
                    });
                    activeSourceEffect = isolatedBlob;
                }

                if (statusLabel) statusLabel.innerText = "Scaling Graphics Pipeline...";

                const img = new Image();
                img.src = URL.createObjectURL(activeSourceEffect);

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let targetWidth = img.width * (scaleVal / 100);
                    let targetHeight = img.height * (scaleVal / 100);

                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    
                    ctx.clearRect(0, 0, targetWidth, targetHeight);
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                    canvas.toBlob(blob => {
                        URL.revokeObjectURL(img.src);
                        if (activeSourceEffect !== file) {
                            URL.revokeObjectURL(activeSourceEffect);
                        }
                        
                        const outputBlob = stripMeta ? new Blob([blob], {type: format}) : blob;
                        const url = URL.createObjectURL(outputBlob);
                        
                        const origBaseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                        const formattedName = template.replace('[name]', origBaseName);
                        
                        const resultItem = {
                            name: formattedName,
                            blob: outputBlob,
                            url,
                            size: outputBlob.size,
                            width: Math.round(targetWidth),
                            height: Math.round(targetHeight),
                            targetExtension: extensionMap[format]
                        };
                        
                        results[index] = resultItem;
                        processedCount++;
                        convertBtn.innerHTML = `<div class="spinner"></div> Executing (${Math.round((processedCount / totalFiles) * 100)}%)`;

                        renderSingleResult(index, resultItem);
                        resolve();
                    }, format, quality);
                };
            } catch (err) {
                console.error("Pipeline failure on asset index " + index, err);
                const card = document.getElementById(`card-${index}`);
                if (card) {
                    card.innerHTML = `<div class="stats" style="color:#ef4444; font-size:0.7rem; line-height:1.4;"><strong>Pipeline Error:</strong> Local process blocked.<br>Ensure you are serving this file from localhost (Live Server) and not file:///</div>`;
                }
                resolve();
            }
        });
    });

    await Promise.all(processingPromises);
    convertBtn.disabled = false;
    convertBtn.innerHTML = `Run Pipeline`;
}

function renderSingleResult(index, item) {
    const card = document.getElementById(`card-${index}`);
    if (!card || !item) return;

    const outExt = item.targetExtension.toUpperCase();

    card.innerHTML = `
        <img src="${item.url}">
        <div class="stats">
            <strong>OUT:</strong> ${item.name}.${item.targetExtension}<br>
            <strong>SIZE:</strong> ${(item.size/1024).toFixed(1)} KB<br>
            <span class="meta-tag">${outExt}</span>
            <span class="meta-tag">${item.width}x${item.height} px</span>
        </div>
        <div class="card-actions">
            <button onclick="downloadSingle(${index})">Download</button>
            <button onclick="copyToClipboard(${index})" id="copy-${index}">Copy Img</button>
        </div>
    `;
}

async function copyToClipboard(index) {
    const item = results[index];
    if(!item) return;
    const copyBtn = document.getElementById(`copy-${index}`);
    
    try {
        await navigator.clipboard.write([
            new ClipboardItem({ [item.blob.type]: item.blob })
        ]);
        copyBtn.innerText = "Copied!";
        copyBtn.style.borderColor = "#00ffaa";
        setTimeout(() => { copyBtn.innerText = "Copy Img"; copyBtn.style.borderColor = "#27272a"; }, 2000);
    } catch (err) {
        alert("Clipboard pipeline blocked. Try downloading the file directly.");
    }
}

function downloadSingle(index){
    const item = results[index];
    if(!item) return;
    const a = document.createElement('a');
    a.href = item.url;
    a.download = `${item.name}.${item.targetExtension}`;
    a.click();
}

function downloadZip(){
    if(results.length === 0) return alert("No compiler results found.");
    const zip = new JSZip();
    results.forEach(r => { if(r) zip.file(`${r.name}.${r.targetExtension}`, r.blob); });
    zip.generateAsync({type:"blob"}).then(content => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = "blackbox_export.zip";
        a.click();
    });
}
</script>
</body>
</html>
